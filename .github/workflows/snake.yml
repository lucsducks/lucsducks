name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: serpiente-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Generar la serpiente (oscura y clara)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#0f3d38,#13655c,#1c9c8c,#2dd4bf
            dist/serpiente-light.svg?palette=github-light&color_snake=#0f766e

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
